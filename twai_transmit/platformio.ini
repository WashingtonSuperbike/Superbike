; PlatformIO Project Configuration File for ESP32-S3-Touch-LCD-5
;
; This project is configured for the ESP32-S3 with TWAI (CAN) support
; Based on the Waveshare ESP32-S3-Touch-LCD-5 board

[env:twai_transmit]
platform = espressif32
; Waveshare ESP32-S3-Touch-LCD-5 uses esp32-s3-devkitc-1 as the base board
; with manual overrides for 16MB flash
board = esp32-s3-devkitc-1
framework = arduino

; Board-specific settings for Waveshare ESP32-S3-Touch-LCD-5
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
; 16MB flash (board spec)
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
; Required for USB CDC to work (flag alone is insufficient)
board_build.arduino.cdc_on_boot = 1

; USB CDC and performance build flags
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    ; Performance (CONFIG_COMPILER_OPTIMIZATION_PERF equivalent)
    -O2
    ; Timing and cache
    -DCONFIG_FREERTOS_HZ=1000
    -DCONFIG_ESP32S3_DATA_CACHE_LINE_64B=1

; Build sources
build_src_filter =
    -<*>
    +<twai_transmit/src/>

; Serial monitor settings
monitor_speed = 115200
monitor_filters =
    default
    time

; Upload settings
upload_speed = 921600
